services:
  db:
    image: postgres:16
    container_name: tontyn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tontyn
      POSTGRES_USER: tontyn
      POSTGRES_PASSWORD: tontyn
    ports:
      - "5432:5432"
    volumes:
      - tontyn_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tontyn-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tontyn.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  tontyn_data:
