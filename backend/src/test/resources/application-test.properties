# Profil de test : base H2 en memoire, isolee du profil "h2" de developpement
# (celui-ci active JeuDeDonneesH2, qui semerait des comptes de demonstration
# non desires dans les tests). Chaque test cree ses propres donnees.

spring.datasource.url=jdbc:h2:mem:tontyn-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

app.mail.enabled=false

# L'assistant doit se comporter comme actif en test (ClientDeepSeek est
# remplace par un mock dans les tests qui en ont besoin) : sans cle non vide,
# AssistantService renverrait toujours une reponse degradee.
app.assistant.active=true
app.assistant.cle-api=cle-de-test
