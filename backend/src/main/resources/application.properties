spring.application.name=Tontyn
# Profil actif par defaut : dev (voir application-dev.properties)
spring.profiles.active=dev

# JPA / Hibernate (commun)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Securite
# La vraie cle vient de la variable d'environnement JWT_SECRET (a privilegier,
# ne pas committer). Valeur de repli fournie pour le developpement local.
app.jwt.secret=${JWT_SECRET:dev-uniquement-remplacer-par-la-variable-d-environnement-JWT_SECRET}
app.jwt.expiration-ms=3600000

# Origines autorisees pour le CORS (front React + client mobile)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8100,capacitor://localhost,http://10.0.2.2:8080

# --- Envoi d'e-mails (SMTP) ---
# Les identifiants ne figurent JAMAIS dans ce fichier : ils proviennent des
# variables d'environnement MAIL_USERNAME et MAIL_PASSWORD. Si elles sont
# absentes, EmailService bascule automatiquement en journalisation du code.
app.mail.enabled=true
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Adresse et libelle affiches comme expediteur
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.expediteur=Tontyn

# --- Comptes de demonstration (profil h2) ---
# Valeurs de repli fictives. Les adresses reelles sont definies dans
# application-local.properties, exclu du depot Git.
app.comptes.admin.email=${TONTYN_EMAIL_ADMIN:admin@tontyn.sn}
app.comptes.admin.nom=Diop
app.comptes.admin.prenom=Awa
app.comptes.membre1.email=${TONTYN_EMAIL_MEMBRE1:membre1@tontyn.sn}
app.comptes.membre1.nom=Ndiaye
app.comptes.membre1.prenom=Moussa
app.comptes.membre2.email=${TONTYN_EMAIL_MEMBRE2:membre2@tontyn.sn}
app.comptes.membre2.nom=Fall
app.comptes.membre2.prenom=Fatou
