spring.application.name=Tontyn
# Profil actif par defaut : dev (voir application-dev.properties)
spring.profiles.active=dev

# JPA / Hibernate (commun)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Securite
# La vraie cle vient de la variable d'environnement JWT_SECRET (a privilegier,
# ne pas committer). Valeur de repli fournie pour le developpement local.
app.jwt.secret=${JWT_SECRET:dev-uniquement-remplacer-par-la-variable-d-environnement-JWT_SECRET}
app.jwt.expiration-ms=3600000

# Origines autorisees pour le CORS (front React + client mobile)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8100,capacitor://localhost,http://10.0.2.2:8080

# --- Envoi d'e-mails (SMTP) ---
# Les identifiants ne figurent JAMAIS dans ce fichier : ils proviennent des
# variables d'environnement MAIL_USERNAME et MAIL_PASSWORD. Si elles sont
# absentes, EmailService bascule automatiquement en journalisation du code.
app.mail.enabled=true
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Adresse et libelle affiches comme expediteur
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.expediteur=Tontyn

# --- Envoi des codes par message court (SMS) ---
# Le raccordement a une passerelle d'operateur suppose un agrement commercial.
# Tant que app.sms.fournisseur vaut JOURNAL, le code est ecrit dans les journaux
# applicatifs : le parcours d'authentification demeure rigoureusement identique.
app.sms.fournisseur=${SMS_FOURNISSEUR:JOURNAL}
app.sms.expediteur=${SMS_EXPEDITEUR:Tontyn}
app.sms.cle-api=${SMS_CLE_API:}

# Renvoie le code de verification dans la reponse HTTP. Reserve au developpement :
# active en production, ce reglage annulerait le second facteur.
app.auth.exposer-code=${AUTH_EXPOSER_CODE:false}

# --- Comptes de demonstration (profil h2) ---
# Les comptes sont identifies par leur numero de telephone. Les numeros reels
# peuvent etre definis dans application-local.properties, exclu du depot Git.
app.comptes.code-pin=${TONTYN_CODE_PIN:1234}
app.comptes.admin.telephone=${TONTYN_TEL_ADMIN:+221770000001}
app.comptes.admin.nom=Diop
app.comptes.admin.prenom=Awa
app.comptes.membre1.telephone=${TONTYN_TEL_MEMBRE1:+221770000002}
app.comptes.membre1.nom=Ndiaye
app.comptes.membre1.prenom=Moussa
app.comptes.membre2.telephone=${TONTYN_TEL_MEMBRE2:+221770000003}
app.comptes.membre2.nom=Fall
app.comptes.membre2.prenom=Fatou

# --- Verification d'identite et deplafonnement ---
# Plafonds du montant du tour (cotisation x nombre de membres), par palier.
# Le principe transpose celui retenu par la BCEAO pour la monnaie electronique :
# les plafonds ne sont releves qu'au benefice des personnes regulierement
# identifiees, et le sont progressivement. Le plafond d'une tontine est celui
# de son membre le moins verifie.
#
# Le plafond porte sur le tour d'une tontine, non sur l'engagement cumule d'un
# utilisateur : un membre peut, en multipliant les groupes, depasser le plafond
# qui lui est applicable. Le seuil bas du premier palier rend ce contournement
# peu praticable ; son controle demeure une piste d'evolution.
#   - numero de telephone confirme seulement
app.verification.plafond-non-verifie=${TONTYN_PLAFOND_NON_VERIFIE:200000}
#   - etat civil declare et portrait fourni
app.verification.plafond-simple=${TONTYN_PLAFOND_SIMPLE:1000000}
#   - piece d'identite validee : aucun plafond

# Repertoire de depot des pieces d'identite, hors arborescence publique.
app.verification.repertoire=${TONTYN_REPERTOIRE_PIECES:./donnees/pieces}

# Duree de conservation des images apres decision, en jours.
app.verification.retention-jours=${TONTYN_RETENTION_PIECES:30}

# Sel applicatif ajoute avant hachage du numero de piece. Un numero d'identite
# a une entropie faible et un format previsible : une empreinte nue se
# retrouverait par recherche exhaustive. Ce sel doit rester hors du depot.
app.verification.sel=${TONTYN_SEL_PIECES:${JWT_SECRET:sel-de-developpement-a-remplacer}}

# Raccordement d'un fournisseur de verification automatique (Smile ID, uqudo...).
# Tant que ce reglage vaut false, l'instruction du palier complet est humaine.
app.verification.instruction-automatique=${TONTYN_VERIFICATION_AUTO:false}

# Taille maximale acceptee pour une image transmise.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=30MB

# --- Score de fiabilite de paiement ---
# Ponderation de regles explicables (ScoreFiabiliteService), pas un modele
# appris : voir le commentaire de tete de la classe pour les deux raisons qui
# l'imposent. Score = 100 - malus ponctualite - malus retards en cours -
# malus delai de regularisation, chaque malus etant individuellement plafonne.
#   - poids retire si 0% des cotisations jugees sont a temps
app.score.poids-ponctualite=${TONTYN_SCORE_POIDS_PONCTUALITE:50}
#   - points retires par cotisation actuellement en retard et non soldee
app.score.malus-retard-par-unite=${TONTYN_SCORE_MALUS_RETARD_UNITE:10}
#   - plafond de ce malus, quel que soit le nombre de retards en cours
app.score.malus-retard-plafond=${TONTYN_SCORE_MALUS_RETARD_PLAFOND:30}
#   - points retires par jour de retard moyen constate a la regularisation
app.score.malus-regularisation-par-jour=${TONTYN_SCORE_MALUS_REGUL_JOUR:1}
#   - plafond de ce malus
app.score.malus-regularisation-plafond=${TONTYN_SCORE_MALUS_REGUL_PLAFOND:20}
# Seuils du nombre de cotisations jugees (payees ou en retard) determinant le
# niveau de confiance du score : sous le premier seuil, confiance FAIBLE ;
# entre les deux, MOYENNE ; au-dela du second, ELEVEE. En dessous de zero
# cotisation jugee, le score n'est pas calcule (confiance INSUFFISANT).
app.score.seuil-confiance-faible=${TONTYN_SCORE_SEUIL_FAIBLE:5}
app.score.seuil-confiance-moyenne=${TONTYN_SCORE_SEUIL_MOYENNE:15}
