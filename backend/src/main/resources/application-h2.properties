# --- Profil H2 : base en memoire, aucun serveur externe requis ---
# Usage : mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Permet de demarrer et tester le backend sans PostgreSQL ni Docker.

spring.datasource.url=jdbc:h2:mem:tontyn;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console web H2 : http://localhost:8080/h2-console
# (JDBC URL a saisir : jdbc:h2:mem:tontyn, utilisateur : sa, sans mot de passe)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Envoi reel des codes de verification par e-mail.
# EmailService retombe automatiquement sur la journalisation du code si les
# variables MAIL_USERNAME / MAIL_PASSWORD ne sont pas definies : le profil h2
# reste donc utilisable hors connexion, sans aucune modification.
app.mail.enabled=true
