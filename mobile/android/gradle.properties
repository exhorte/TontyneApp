org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Surveillance du systeme de fichiers desactivee.
# Sous Windows, elle maintient des descripteurs ouverts sur les repertoires du
# dossier build/, ce qui fait echouer la tache cleanMergeDebugAssets avec
# « Unable to delete directory ». Le gain de vitesse qu'elle procure ne
# compense pas ce blocage.
org.gradle.vfs.watch=false
